<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Akshita 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3ec;--bg2:#e6dcff;--ink:#4a2c40;--soft:#8a6a7e;--card:rgba(255,255,255,.65);--accent:#e8537a;--accent2:#b06ab3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1530;--bg2:#161433;--ink:#fbe8f0;--soft:#c9a9bd;--card:rgba(255,255,255,.08);--accent:#ff7a9c;--accent2:#c58cff}}
:root[data-theme="dark"]{--bg1:#2a1530;--bg2:#161433;--ink:#fbe8f0;--soft:#c9a9bd;--card:rgba(255,255,255,.08);--accent:#ff7a9c;--accent2:#c58cff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--ink);font-family:'Poppins',system-ui,sans-serif;font-weight:300;overflow:hidden;display:flex;align-items:center;justify-content:center}
canvas{position:fixed;inset:0;pointer-events:none}
.stage{position:relative;width:min(92vw,460px);text-align:center;z-index:2}
.scene{display:none;animation:in .9s ease both}
.scene.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-weight:500}
h1{font-size:2.3rem;margin-bottom:.4rem}
.sub{color:var(--soft);margin-bottom:1.6rem}
.env{font-size:6rem;cursor:pointer;display:inline-block;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(232,83,122,.35))}
@keyframes bob{50%{transform:translateY(-12px) rotate(-4deg)}}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35);border-radius:26px;padding:2rem 1.6rem;box-shadow:0 20px 50px rgba(120,60,110,.18);min-height:210px;display:flex;flex-direction:column;justify-content:center}
.card p{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:1.3rem;line-height:1.6}
.dots{display:flex;gap:8px;justify-content:center;margin:1.2rem 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--soft);opacity:.35;transition:.4s}
.dots i.a{background:var(--accent);opacity:1;transform:scale(1.4)}
button{font:inherit;font-weight:400;border:0;border-radius:50px;padding:.85rem 1.8rem;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 22px rgba(232,83,122,.35);transition:transform .2s}
button:hover{transform:scale(1.06)}
button.ghost{background:var(--card);color:var(--ink);box-shadow:none;border:1px solid var(--soft)}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:1.4rem;min-height:56px}
#no{transition:left .25s,top .25s}
.big{font-size:4rem;margin-bottom:.6rem}
.note{margin-top:1rem;color:var(--soft);min-height:1.4em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="stage">

  <section class="scene on" id="s0">
    <div class="env" id="env" role="button" aria-label="Open">💌</div>
    <h1 style="margin-top:1rem">Akshita, I wrote this for you</h1>
    <p class="sub">Tap the envelope to open it</p>
  </section>

  <section class="scene" id="s1">
    <div class="card"><p id="msg"></p></div>
    <div class="dots" id="dots"></div>
    <button id="next">Continue</button>
  </section>

  <section class="scene" id="s2">
    <div class="big">🥺</div>
    <h2 style="font-size:1.9rem">Akshita, can you forgive me?</h2>
    <p class="sub" style="margin-top:.5rem">I'll work every day to earn back your trust.</p>
    <div class="row">
      <button id="yes">Yes, I forgive you 💗</button>
      <button id="no" class="ghost">No</button>
    </div>
    <p class="note" id="note"></p>
  </section>

  <section class="scene" id="s3">
    <div class="big">💞</div>
    <h1>Thank you, Akshita</h1>
    <p class="sub" style="font-size:1.1rem;line-height:1.7">You have no idea how happy this makes me.<br>I promise to listen more, to be better,<br>and to never take you for granted.</p>
    <button class="ghost" id="again">Read it again</button>
  </section>

</div>

<script>
const messages=[
 "Akshita, I'm sorry. Truly, from the bottom of my heart.",
 "I know I hurt you, and I understand why you're upset. You deserve honesty and respect, and I didn't give you enough of either.",
 "I'm not asking you to forget what happened. I'm asking for a chance to show you who I really am.",
 "You matter so much to me. Losing your trust is the last thing I ever wanted."
];
const $=id=>document.getElementById(id);
function show(n){document.querySelectorAll('.scene').forEach(s=>s.classList.remove('on'));$('s'+n).classList.add('on')}
let i=0;
function renderMsg(){
  const el=$('msg');el.style.opacity=0;
  setTimeout(()=>{el.textContent=messages[i];el.style.transition='opacity .8s';el.style.opacity=1},200);
  $('dots').innerHTML=messages.map((_,k)=>`<i class="${k===i?'a':''}"></i>`).join('');
  $('next').textContent=i===messages.length-1?'One last thing 💭':'Continue';
}
$('env').onclick=()=>{burst(innerWidth/2,innerHeight/2,18,'💗');i=0;show(1);renderMsg()};
$('next').onclick=()=>{if(i<messages.length-1){i++;renderMsg()}else show(2)};
$('again').onclick=()=>{i=0;show(1);renderMsg()};


  const ENDPOINT = "https://formspree.io/f/mkjooqvw"; // your endpoint
function report(answer){
  fetch(ENDPOINT,{
    method:"POST",
    headers:{"Content-Type":"application/json","Accept":"application/json"},
    body:JSON.stringify({answer, time:new Date().toString()})
  }).catch(()=>{});
}

/* the "No" button gently dodges, then softens */
let dodges=0;
const no=$('no');
// function dodge(e){
//   if(dodges>=4)return;
//   e&&e.preventDefault();
//   dodges++;
//   const pad=20,w=no.offsetWidth,h=no.offsetHeight;
//   no.style.position='fixed';
//   no.style.left=pad+Math.random()*(innerWidth-w-2*pad)+'px';
//   no.style.top=pad+Math.random()*(innerHeight-h-2*pad)+'px';
//   if(dodges>=4){
//     no.textContent='I need more time';
//     setTimeout(()=>{no.style.position='static'},400);
//   }
// }

const moveArea = 150;

function dodge(e){
  if(dodges >= 4) return;

  e && e.preventDefault();
  dodges++;

  no.style.position = 'fixed';

  const rect = no.getBoundingClientRect();

  // Current button position
  const currentX = rect.left;
  const currentY = rect.top;

  // Random movement within 150px
  const x = currentX + (Math.random() - 0.5) * moveArea;
  const y = currentY + (Math.random() - 0.5) * moveArea;

  // Keep button inside viewport
  const maxX = window.innerWidth - rect.width;
  const maxY = window.innerHeight - rect.height;

  no.style.left = `${Math.max(0, Math.min(x, maxX))}px`;
  no.style.top = `${Math.max(0, Math.min(y, maxY))}px`;

  if(dodges >= 4){
    no.textContent = 'I need more time';

    setTimeout(() => {
      no.style.position = 'static';
      no.style.left = '';
      no.style.top = '';
    }, 400);
  }
}
  
no.addEventListener('mouseenter',dodge);
no.addEventListener('touchstart',dodge,{passive:false});
no.addEventListener('click',()=>{
  // if(dodges>=4)$('note').textContent="That's okay. Take all the time you need. I'll be here. 🤍";
  // else dodge();
  if(dodges>=4){
  report("Akshita needs more time 🤍");
  $('note').textContent="That's okay. Take all the time you need. I'll be here. 🤍";
}
else dodge();
});

// $('yes').onclick=()=>{show(3);burst(innerWidth/2,innerHeight/2,70,'💖')};


$('yes').onclick=()=>{
  report("Akshita said YES, she forgave you 💗");
  show(3); burst(innerWidth/2,innerHeight/2,70,'💖');
};

/* floating hearts + bursts */
const cv=$('c'),ctx=cv.getContext('2d');
let P=[];
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',size);size();
function floaty(){return{x:Math.random()*innerWidth,y:innerHeight+20,vx:(Math.random()-.5)*.4,vy:-(.4+Math.random()*.9),s:12+Math.random()*18,a:.25+Math.random()*.4,e:Math.random()<.5?'🌸':'🤍',life:1,g:0}}
function burst(x,y,n,e){for(let k=0;k<n;k++){const a=Math.random()*6.28,v=3+Math.random()*7;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,s:16+Math.random()*20,a:1,e,life:1,g:.12})}}
setInterval(()=>{if(P.length<45)P.push(floaty())},350);
(function loop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  P=P.filter(p=>p.y>-40&&p.life>0);
  for(const p of P){
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;
    if(p.g){p.life-=.012}
    ctx.globalAlpha=Math.max(0,p.a*(p.g?p.life:1));
    ctx.font=p.s+'px serif';ctx.fillText(p.e,p.x,p.y);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
